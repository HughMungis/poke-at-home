# Builds the contributor image for amd64 and arm64 and publishes it to GHCR.
#
# 🔑 BUILT HERE RATHER THAN ON THE SERVER, deliberately. The server is two shared ARM cores that
# also encode a live broadcast, and cross-building amd64 there means qemu emulation — measured at
# 9+ minutes for a steamcmd no-op. CI is free for a public repository and has native runners.
name: contributor image

on:
  push:
    branches: [main]
    paths:
      - contrib/**
      - repo/v2/**
      - gamereg.py
      - eval_checkpoint.py
      - make_ladder.py
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:          # so the image can be rebuilt without a code change

permissions:
  contents: read
  packages: write             # required to push to ghcr.io; nothing else is granted

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🚨 GHCR REJECTS UPPERCASE. The owner here is "HughMungis", so
      # ghcr.io/${{ github.repository_owner }}/... fails with an unhelpful auth-shaped error.
      # Computed rather than hardcoded so a rename or a fork still publishes correctly.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/poke-contrib" >> "$GITHUB_OUTPUT"

      # arm64 is built under emulation. It is slow (pip work is emulated) but it is one job and
      # it needs no extra runners; split into a native matrix + manifest merge if it ever bites.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # scoped to this repo, expires with the run

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .                    # repo root: the Dockerfile COPYs from repo/v2 and /
          file: contrib/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🚨 A PUBLISHED IMAGE THAT CANNOT START IS WORSE THAN NO IMAGE — a contributor finds out,
      # not us. This catches the whole class of build-succeeds/run-fails faults: a COPY that
      # missed a file, a missing shared library, an entrypoint typo. Only the runner's own
      # architecture is exercised; the arm64 image is built but not run here.
      - name: Smoke-test the image
        run: |
          IMG="${{ steps.img.outputs.name }}:latest"
          docker run --rm --entrypoint python3 "$IMG" -c "
          import pyboy, torch, stable_baselines3, gymnasium, numpy
          import importlib.metadata as md
          for m in ('pyboy','torch','stable_baselines3','gymnasium','numpy'):
              print(f'  {m} {md.version(m)}')
          print('imports ok')"
          # The entrypoint must run. --check exits non-zero without a ROM, which is correct
          # behaviour, so assert on --help instead: it proves argparse and the module load.
          docker run --rm "$IMG" --help

      - name: Where it went
        run: |
          echo "::notice::Pushed ${{ steps.img.outputs.name }}:latest"
          echo "::notice::A newly created GHCR package is PRIVATE. Make it public once, at
          https://github.com/users/${{ github.repository_owner }}/packages/container/poke-contrib/settings"
